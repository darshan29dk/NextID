server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (e.g. /approval-workflow/requests/5),
    # which aren't real files on disk — fall back to index.html so refreshing
    # a deep link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
