services:
  # ── Complete NextID Platform (Single Consolidated Web Service) ──
  - type: web
    name: nextid
    runtime: python
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "false"
      - key: ENCRYPTION_KEY
        value: "dGhlc2VjcmV0a2V5bXVzdGJlMzJieXRlc2xvbmcxMjM="
      - key: PROVIDER_SECRET_KEY
        value: "uO1xR9k5mZgT6Vn3pL8wQ2yA4cB7dF0eH1jK3mP5sN8="
