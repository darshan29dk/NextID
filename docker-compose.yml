version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nextid-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: nextid-backend
    ports:
      - "8000:8000"
    environment:
      - NEXTID_PROVIDER_MODE=mock
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nextid
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: nextid-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
