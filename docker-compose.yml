version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nextid-postgres
    restart: always
    environment:
      POSTGRES_DB: ranalyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranalyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextid-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ranalyzer
      - DB_SSL=false
      - ENCRYPTION_KEY=dGhlc2VjcmV0a2V5bXVzdGJlMzJieXRlc2xvbmcxMjM=
      - PROVIDER_SECRET_KEY=uO1xR9k5mZgT6Vn3pL8wQ2yA4cB7dF0eH1jK3mP5sN8=
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: nextid-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
