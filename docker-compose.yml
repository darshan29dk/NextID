services:
  backend:
    build: ./backend
    container_name: ranalyzer-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Set to http://localhost:8000/api for local Docker testing (this machine).
        # Set to http://4.240.74.5:8000/api instead when actually deploying this
        # compose file on the Azure VM, so the browser can reach the backend
        # over the network rather than through the container's own loopback.
        VITE_API_BASE_URL: http://4.240.74.5:8000/api
    container_name: ranalyzer-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
